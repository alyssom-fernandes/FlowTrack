name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E — demonstração no navegador
    runs-on: ubuntu-24.04  # o ubuntu-latest passou a ser o 26.04, que o Playwright ainda não suporta
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # O Playwright faz o build e sobe o preview (playwright.config.ts).
      # Sem variáveis do Supabase o app roda só em demonstração, sem depender de servidor.
      - name: Run E2E tests
        run: npm run e2e

      # Contraste e tamanho de pílulas e selos (frontend/scripts/checar-contraste.mjs), no build que o E2E gerou
      - name: Contrast check
        run: |
          npm --prefix frontend run preview -- --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4174/login > /dev/null && break; sleep 1; done
          node frontend/scripts/checar-contraste.mjs --base http://localhost:4174

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
