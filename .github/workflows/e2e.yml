name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E — demonstração no navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # O Playwright faz o build e sobe o preview (playwright.config.ts).
      # Sem variáveis do Supabase o app roda só em demonstração, sem depender de servidor.
      - name: Run E2E tests
        run: npm run e2e

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
